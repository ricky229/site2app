<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Loading...</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #3498db;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 24px;
      font-weight: 300;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h1 id="app-name">Loading...</h1>
  <script>
    fetch('app-config.json')
      .then(res => res.json())
      .then(config => {
        document.getElementById('app-name').innerText = config.appName || 'Loading...';
        document.title = config.appName || 'Loading...';
      })
      .catch(e => console.error(e));
  </script>
</body>
</html>
