name: Build APK

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Accept Android licenses
      run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

    - name: Install dependencies
      working-directory: ./backend
      run: npm install

    - name: Build APK and upload to Firebase Storage
      working-directory: ./backend
      run: node scripts/github-build-firebase.js
      env:
        BUILD_DATA: ${{ github.event.client_payload.buildData }}
        FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        FUNCTIONS_URL: ${{ secrets.FUNCTIONS_URL }}
        BUILDER_SECRET: ${{ secrets.BUILDER_SECRET }}
