name: Build Desktop App

on:
  repository_dispatch:
    types: [build_desktop]

jobs:
  build-windows:
    runs-on: windows-latest
    if: contains(toJson(github.event.client_payload.platforms), 'windows')
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build and Upload Windows App
        run: npx tsx scripts/github-build-desktop.js
        env:
          BUILD_DATA: ${{ toJson(github.event.client_payload.buildData) }}
          FUNCTIONS_URL: https://us-central1-${{ secrets.FIREBASE_PROJECT_ID }}.cloudfunctions.net/api
          BUILDER_SECRET: ${{ secrets.BUILDER_SECRET }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

  build-macos:
    runs-on: macos-latest
    if: contains(toJson(github.event.client_payload.platforms), 'macos')
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build and Upload macOS App
        run: npx tsx scripts/github-build-desktop.js
        env:
          BUILD_DATA: ${{ toJson(github.event.client_payload.buildData) }}
          FUNCTIONS_URL: https://us-central1-${{ secrets.FIREBASE_PROJECT_ID }}.cloudfunctions.net/api
          BUILDER_SECRET: ${{ secrets.BUILDER_SECRET }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
